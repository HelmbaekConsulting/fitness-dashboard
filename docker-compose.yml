# For Unraid with the Compose Manager plugin, or any Docker host. Paths are Unraid's usual appdata and share folders.
services:
  fitness:
    image: ghcr.io/helmbaekconsulting/fitness-dashboard:latest   # or build: . to build on the server
    container_name: fitness-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      TZ: Europe/Copenhagen
    volumes:
      - /mnt/user/appdata/fitness-dashboard:/data
      - /mnt/user/fitness-import:/import

  # Optional: the dashboard on your own address outside the home network, through a Cloudflare Tunnel behind
  # Cloudflare Access (README, "Open it from outside"). Remove this service to stay on the home network only.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: fitness-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - fitness
